plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
}

version '1.0.0'

ext {
    mindustryVersion = 'v159.7'
}

sourceSets.main.kotlin.srcDirs = ["src"]
sourceSets.main.resources.srcDirs = ["src"]

// Android 不提供 java.lang.invoke.StringConcatFactory / LambdaMetafactory：
// 强制字符串拼接用老式 StringBuilder（stringConcat=inline）。
tasks.withType(JavaCompile) {
    options.compilerArgs += ["-XDstringConcat=inline"]
}

// Android 兼容：Kotlin 默认字符串拼接与 SAM lambda 会生成 invokedynamic，
// ART 不支持，强制改用 StringBuilder 与匿名类。
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += ["-Xstring-concat=inline"]
        jvmTarget = "17"
    }
}

kotlin {
    jvmToolchain(17)
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
    compileOnly "com.github.Anuken.Arc:arc-core:208a754044"
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "liquid-tank-shader-mod.jar"
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(rootDir) {
        include "mod.json"
    }
    from("shaders") {
        include "**"
        into("shaders")
    }
    from("textures") {
        include "**"
        into("textures")
    }
}